{% extends 'base/layout.html' %}
{% load static %}

{% block content %}
<div class="settings-container">
    <!-- CSRF Token for JavaScript -->
    {% csrf_token %}

    <!-- Settings Overview -->
    <div class="settings-overview">
        <h1>Settings</h1>
        <p class="settings-description">Manage your application preferences and configurations</p>
    </div>

    <!-- Settings Sections -->
    <div class="settings-grid">
        <!-- User Preferences -->
        <div class="settings-section">
            <h2>
                <span class="material-icons-round">person</span>
                User Preferences
            </h2>
            <div class="settings-content">
                <div class="setting-item">
                    <label>Display Name</label>
                    <input type="text" value="{{ user.first_name|default:user.username }}" />
                </div>
                <div class="setting-item">
                    <label>Password</label>
                    <div class="setting-actions">
                        <a href="{% url 'person:change_password' %}" class="btn btn-outline-primary">
                            <span class="material-icons-round">lock</span>
                            Change Password
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- System Settings -->
        <div class="settings-section">
            <h2>
                <span class="material-icons-round">settings</span>
                System Settings
            </h2>
            <div class="settings-content">
                <div class="setting-item">
                    <label>Dark Mode</label>
                    <div class="toggle-switch">
                        <input type="checkbox" id="dark-mode" {% if user_preference.dark_mode %}checked{% endif %}>
                        <label for="dark-mode"></label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Save Button -->
    <div class="settings-actions">
        <button class="save-settings">Save Changes</button>
    </div>
</div>
{% endblock %}

{% block extrahead %}
<script src="{% static 'js/settings.js' %}"></script>
<style>
.setting-actions {
    display: flex;
    gap: 0.5rem;
    align-items: center;
}

.btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    border: 1px solid transparent;
    border-radius: 4px;
    font-size: 0.875rem;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.15s ease-in-out;
}

.btn-outline-primary {
    color: var(--color-primary);
    border-color: var(--color-primary);
    background-color: transparent;
}

.btn-outline-primary:hover {
    color: var(--color-white);
    background-color: var(--color-primary);
    border-color: var(--color-primary);
}

.btn-outline-primary .material-icons-round {
    font-size: 1rem;
}
</style>
{% endblock %}
