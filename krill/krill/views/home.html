<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Krill</title>
</head>
<body>
    <div class="container">
        <!-- Begin Sidebar -->
        <aside>
            <div class="toggle">
                <div class="logo">
                    <img src="images/krill.png">
                    <h2>Krill</h2>
                </div>
                <div class="close" id="close-btn">
                    <span class="material-icons-round">
                        close
                    </span>
                </div>
            </div>

            <div class="sidebar">
                <a href="#">
                    <span class="material-icons-round">
                        dashboard
                    </span>
                    <h3>Dashboard</h3>
                </a>
                <a href="#" class="active">
                    <span class="material-icons-round">
                        science
                    </span>
                    <h3>Samples</h3>
                </a>
                <a href="#">
                    <span class="material-icons-round">
                        kitchen
                    </span>
                    <h3>Storage</h3>
                </a>
                <a href="#">
                    <span class="material-icons-round">
                        receipt_long
                    </span>
                    <h3>History</h3>
                </a>
                <a href="#">
                    <span class="material-icons-round">
                        settings
                    </span>
                    <h3>Settings</h3>
                </a>
                <a href="#">
                    <span class="material-icons-round">
                        logout
                    </span>
                    <h3>Logout</h3>
                </a>
            </div>
        </aside>
        <!-- End of Sidebar -->

        <!-- Main Content -->
        <main>
            <h1>Samples</h1>
            <!-- Samples -->
            <div class="samples">
                Samples list
            </div>
        </main>

        <!-- End of Main Content -->

        <!-- Right Sidebar -->
        <div class="right-section">
            <div class="nav">
                <button id="menu-btn">
                    <span class="material-icons-round">
                        menu
                    </span>
                </button>
                <div class="dark-mode">
                    <span class="material-icons-round active">
                        light_mode
                    </span>
                    <span class="material-icons-round">
                        dark_mode
                    </span>
                </div>

                <div class="profile">
                    <div class="info">
                        <p> Hey, <b>Jacob</b></p>
                        <small class="text-muted">Admin</small>
                    </div>

                </div>
            </div>
        </div>

        <!-- End of Right Sidebar -->
    </div>

    <script src="index.js"></script>
    
</body>
</html>
