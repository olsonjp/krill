[project]
name = "krill"
version = "0.1.0"
description = "Django application"
requires-python = ">=3.15"
dependencies = [
    # Core
    "Django==6.1.3",

    # Database
    "psycopg2-binary==2.9.13",

    # Monitoring and Logging
    "sentry-sdk==2.74.0",

    # File import
    "openpyxl==3.1.5",

    # Production and Deployment
    "gunicorn==26.2.0",
    "whitenoise==6.12.0",
]

[project.optional-dependencies]
dev = [
    "django-debug-toolbar==8.0.0",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "coverage==7.17.2",
]
