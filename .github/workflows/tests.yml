name: Tests

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'

# Runs the code from the pull request, so the token is read-only and no secrets are used.
# Pull requests from forks (outside collaborators) wait for a maintainer to click
# "Approve and run" (Settings > Actions > General > Fork pull request workflows).
permissions:
  contents: read

# A new push to a PR cancels the superseded run.
concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.x'

      # Installs the Python in .python-version and exactly the locked dependencies.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Check for missing migrations
        working-directory: krill
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run tests
        working-directory: krill
        run: uv run python manage.py test
